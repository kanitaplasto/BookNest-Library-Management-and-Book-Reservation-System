 x="780" y="70" width="300" height="188" rx="10" fill="white" stroke="#cdd8c7"/><path d="M790 70h280q10 0 10 10v31H780v-31q0-10 10-10" fill="#244e42"/><text class="name" x="796" y="97">BOOKS</text><text class="field" x="796" y="138">PK book_id</text><text class="field" x="796" y="161">FK category_id → CATEGORIES</text><text class="field" x="796" y="184">UK isbn; title; description</text><text class="field" x="796" y="207">publication_year, cover_url</text><rect x="40" y="350" width="300" height="188" rx="10" fill="white" stroke="#cdd8c7"/><path d="M50 350h280q10 0 10 10v31H40v-31q0-10 10-10" fill="#244e42"/><text class="name" x="56" y="377">LOANS</text><text class="field" x="56" y="418">PK loan_id</text><text class="field" x="56" y="441">FK user_id → USERS</text><text class="field" x="56" y="464">FK copy_id → BOOK_COPIES</text><text class="field" x="56" y="487">borrowed_at, due_at</text><text class="field" x="56" y="510">returned_at, renewal_count</text><rect x="410" y="350" width="300" height="188" rx="10" fill="white" stroke="#cdd8c7"/><path d="M420 350h280q10 0 10 10v31H410v-31q0-10 10-10" fill="#244e42"/><text class="name" x="426" y="377">BOOK_COPIES</text><text class="field" x="426" y="418">PK copy_id</text><text class="field" x="426" y="441">FK book_id → BOOKS</text><text class="field" x="426" y="464">UK barcode</text><text class="field" x="426" y="487">shelf_location, status</text><rect x="780" y="350" width="300" height="188" rx="10" fill="white" stroke="#cdd8c7"/><path d="M790 350h280q10 0 10 10v31H780v-31q0-10 10-10" fill="#244e42"/><text class="name" x="796" y="377">CATEGORIES</text><text class="field" x="796" y="418">PK category_id</text><text class="field" x="796" y="441">UK name</text><rect x="410" y="640" width="300" height="188" rx="10" fill="white" stroke="#cdd8c7"/><path d="M420 640h280q10 0 10 10v31H410v-31q0-10 10-10" fill="#244e42"/><text class="name" x="426" y="667">AUTHORS</text><text class="field" x="426" y="708">PK author_id</text><text class="field" x="426" y="731">name</text><rect x="780" y="640" width="300" height="188" rx="10" fill="white" stroke="#cdd8c7"/><path d="M790 640h280q10 0 10 10v31H780v-31q0-10 10-10" fill="#244e42"/><text class="name" x="796" y="667">BOOK_AUTHORS</text><text class="field" x="796" y="708">PK,FK book_id → BOOKS</text><text class="field" x="796" y="731">PK,FK author_id → AUTHORS</text><text x="40" y="870" font-size="13">1 : N = one-to-many. BOOK_AUTHORS resolves the Books–Authors many-to-many relationship.</text><text x="40" y="895" font-size="12">Draft only · Full attributes, optionality and business rules: docs/ERD.md · PK = primary key; FK = foreign key; UK = unique.</text></svg>