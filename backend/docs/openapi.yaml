  /api/external/books:
    get:
      tags:
      - External Books
      summary: Search external book catalogues
      description: Search public book metadata. Google Books is the primary provider when its optional API key is configured in backend/config/config.php. Open Library is used as a keyless fallback if the key is empty or Google Books is unavailable. The key is never returned to the browser.
      parameters:
      - name: q
        in: query
        required: true
        description: Book title, author, or ISBN to search.
        schema:
          type: string
          minLength: 1
          maxLength: 120
      - name: maxResults
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 12
      responses:
        '200':
          description: Search results returned from Google Books or the Open Library fallback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalBookSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request data or business-rule violation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested record or endpoint was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Unexpected server or database error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Both external book providers are unavailable or misconfigured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Created:
      description: Record created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatedResponse'
    Updated:
      description: Record updated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    Deleted:
      description: Record deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    Resource:
      description: Requested record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    ResourceList:
      description: Records retrieved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    Unauthorized:
      description: Authentication is required or the supplied token is invalid/expired. Authentication
        middleware is introduced in Milestone 4.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated user does not have the role required for this operation. Authorization
        middleware is introduced in Milestone 4.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Returned resource or list of resources.
    CreatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: integer
              example: 23
            record:
              type: object
    UserInput:
      type: object
      required:
      - full_name
      - email
      - password
      properties:
        full_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum:
          - member
          - librarian
          default: member
    UserUpdate:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          minLength: 8
          description: Optional. Omit to keep the current password.
        role:
          type: string
          enum:
          - member
          - librarian
    BookInput:
      type: object
      required:
      - title
      - total_copies
      - available_copies
      properties:
        title:
          type: string
          maxLength: 200
        isbn:
          type: string
          nullable: true
          maxLength: 20
        publication_year:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
        total_copies:
          type: integer
          minimum: 0
        available_copies:
          type: integer
          minimum: 0
        author_id:
          type: integer
          nullable: true
        category_id:
          type: integer
          nullable: true
    AuthorInput:
      type: object
      required:
      - first_name
      - last_name
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        biography:
          type: string
          nullable: true
    CategoryInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
    LoanInput:
      type: object
      required:
      - book_id
      - user_id
      - borrowed_date
      - due_date
      properties:
        book_id:
          type: integer
          minimum: 1
        user_id:
          type: integer
          minimum: 1
        borrowed_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        returned_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum:
          - Borrowed
          - Returned
          - Overdue
          default: Borrowed
    ReservationInput:
      type: object
      required:
      - user_id
      - book_id
      properties:
        user_id:
          type: integer
          minimum: 1
        book_id:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - Queued
          - Ready
          - Completed
          - Cancelled
          default: Queued
    ExternalBookSearchResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            source:
              type: string
              example: Google Books or Open Library
            totalItems:
              type: integer
            items:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  authors:
                    type: array
                    items:
                      type: string
                  publisher:
                    type: string
                    nullable: true
                  publishedDate:
                    type: string
                    nullable: true
                  description:
                    type: string
                    nullable: true
                  thumbnail:
                    type: string
                    nullable: true
                  infoLink:
                    type: string
                    nullable: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
