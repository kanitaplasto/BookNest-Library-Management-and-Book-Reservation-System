openapi: 3.0.3
info:
  title: BookNest REST API
  version: 1.0.0
  description: REST API for the BookNest Library Management and Book Reservation System. CRUD operations
    are implemented through FlightPHP and use the service layer for validation and business rules. The
    external book search uses Google Books when configured and Open Library as a fallback.
servers:
- url: ..
  description: Current BookNest backend (relative to this Swagger page)
tags:
- name: Users
- name: Books
- name: Authors
- name: Categories
- name: Loans
- name: Reservations
- name: External Books
paths:
  /api:
    get:
      tags:
      - API
      summary: API information
      description: Returns the BookNest API name and the relative Swagger documentation location.
      responses:
        '200':
          description: API information returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/users:
    get:
      tags:
      - Users
      summary: Get all users
