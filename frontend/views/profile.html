
<div class="eyebrow">Your reader identity</div>

<h1>My profile</h1>

<div class="two-col">
    <section class="panel">
        <h2>Personal information</h2>

        <form class="form" id="profile-form">
            <label>
                Full name
                <input name="name" required value="Kanita Plasto" autocomplete="name">
            </label>

            <label>
                Email address
                <input name="email" type="email" required value="kanita@example.com" autocomplete="email">
            </label>

            <label>
                Phone number
                <input name="phone" type="tel" placeholder="Optional" autocomplete="tel">
            </label>

            <button>Save preview</button>
        </form>
    </section>

    <section class="panel">
        <h2>Membership</h2>

        <p>
            <span class="badge">Active · sample account</span>
        </p>

        <p>
            Member ID: BN-2026-001<br>
            Role: Library member<br>
            Loan limit: 3 books<br>
            Reservation limit: 3 books
        </p>

        <p class="muted">
            Changes are displayed as a demo confirmation only and are not persisted.
        </p>

        <a class="button secondary" href="#login">Go to sign in</a>
    </section>
</div>
