
<div class="heading">
    <div>
        <div class="eyebrow">Find your next favourite</div>
        <h1>The book collection</h1>
        <p class="sub">Good stories. New ideas. Something for everyone.</p>
    </div>
</div>

<div class="toolbar">
    <input
        id="search"
        type="search"
        aria-label="Search books"
        placeholder="Search by title or author…"
    >

    <select id="category" aria-label="Filter by category">
        <option value="">All categories</option>
        <option>Fiction</option>
        <option>Classics</option>
        <option>Technology</option>
        <option>Personal growth</option>
        <option>Fantasy</option>
        <option>Biography</option>
    </select>

    <select id="availability" aria-label="Filter by availability">
        <option value="">Any availability</option>
        <option>Available</option>
        <option>Reserved</option>
        <option>On loan</option>
    </select>
</div>

<p class="muted" id="result-count"></p>

<div class="grid" id="catalog-grid"></div>
